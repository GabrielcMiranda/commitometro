name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . -r requirements-dev.txt
      - run: mkdir -p resultados
      - run: pytest --cov=commitometro --cov-report=term-missing --cov-fail-under=85 --junitxml=resultados/junit.xml
      - run: pytest tests/test_afne_equivalencia.py -v

  autoauditoria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: commitometro auditar . --falhar-se-invalido
