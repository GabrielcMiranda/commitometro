[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commitometro"
version = "0.1.0"
description = "Auditor de convenções de commits e versionamento em repositórios Git"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gitpython>=3.1",
    "pydriller>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "streamlit>=1.35",
]

[project.scripts]
commitometro = "commitometro.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
